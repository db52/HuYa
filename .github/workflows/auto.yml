name: 虎牙虎粮自动发放

on:
  schedule:
    - cron: '1 16 * * *'  # 北京时间 00:01；仅默认分支调度
  workflow_dispatch:
    inputs:
      rooms:
        description: '房间号，逗号分隔（诊断可留空）'
        required: false
        default: ''
      mode:
        description: 'diagnose 仅验证登录和库存，不发送礼物'
        type: choice
        options:
          - diagnose
          - send
        required: true
        default: diagnose

permissions:
  contents: read

concurrency:
  group: huya-inventory-and-gifts
  cancel-in-progress: false

jobs:
  send-hl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt
      - name: 无凭证安全回归测试
        run: python -m unittest discover -s tests -v
      - name: 验证登录与库存 / 显式赠送
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_ROOMS: ${{ inputs.rooms || secrets.HUYA_ROOMS }}
          HUYA_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode || 'diagnose' }}
          HEADLESS: 'true'
          PYTHONUNBUFFERED: '1'
        run: python -u main.py --mode "$HUYA_MODE"
      - name: 保存脱敏诊断结果（不含 Cookie、原始 HTML、截图）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huya-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug_artifacts/*.json
          if-no-files-found: ignore
          retention-days: 3
