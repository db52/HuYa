name: 只读双来源包裹诊断
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [diagnose]
        default: diagnose
      rooms:
        default: '998'
      test_notice:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: huya-inventory-and-gifts
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 无凭据诊断安全测试
        run: python -m unittest discover -s tests -p test_dual_diagnose.py -v
      - name: 只读查询两个库存来源（不点击礼物或赠送）
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_ROOMS: '998'
          HUYA_MODE: diagnose
          HEADLESS: 'true'
          PYTHONUNBUFFERED: '1'
        run: python -u diagnose_inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huya-dual-${{ github.run_id }}
          path: dual_diagnostics/result.json
          retention-days: 3
